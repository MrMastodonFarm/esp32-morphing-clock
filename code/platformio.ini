; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two panel variants are built from this one source tree:
;
;   pio run -e 128x64        the wide clock (two chained 64x64, or one 128x64)
;   pio run -e 64x64         the square clock
;
; Everything except geometry is shared. The variant flag selects a config header
; (config_128x64.h / config_64x64.h), a HUB75 pin map (panel_pins_*.h), and exactly
; one weather layout translation unit via build_src_filter. Adding a bug fix or a
; feature to any other file benefits both clocks with no porting.
;
; `pio run` with no -e builds BOTH real variants, which is the check you want before
; pushing a shared change. That is what default_envs pins below - it exists to keep the
; diagnostic envs (128x64-diag, 64x64-diag) out of that build, since pio would otherwise
; build every [env:*] and quietly double the pre-push check.

[platformio]
default_envs = 128x64, 64x64

[env]
platform = espressif32
board = esp32dev
framework = arduino
; min_spiffs has two 1.92MB app slots, which is what makes OTA possible at all
; (huge_app.csv had a single 3MB slot - OTA needs a second slot to write into).
; Firmware measured 0.98MB on 2026-08-07 - 52% of a slot.
; NOTE: a partition-table change only takes effect via USB/esptool flash, not OTA.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
check_skip_packages = yes
lib_deps =
	mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^2.0.1
	adafruit/Adafruit GFX Library @ ^1.10.6
	adafruit/Adafruit BusIO @ ^1.7.2
	SPI
	Wire
	knolleary/PubSubClient @ ^2.8
	https://github.com/gmag11/ESPNtpClient
	bblanchon/ArduinoJson @ ^6.17.3
	adafruit/Adafruit TSL2591 Library @ ^1.3.1

[env:128x64]
build_flags = -DPANEL_VARIANT_128X64
build_src_filter = +<*> -<weather_layout_64x64.cpp>

[env:64x64]
build_flags = -DPANEL_VARIANT_64X64
build_src_filter = +<*> -<weather_layout_128x64.cpp>

; Panel hardware diagnostics. Same identity, same OTA URL and same MQTT topics as the
; matching normal env - it is the same physical clock - but loop() draws only the test
; pattern from panel_diag.cpp. Used to tell a stuck LED from a ghosting artifact, which
; a photo of the running clock cannot.
;
; These are NOT part of `pio run`: they are only built when named explicitly, so the
; unqualified build stays the two real firmwares. Flash one, photograph the panel, then
; push the normal build straight back over it. The boot announcement carries
; "PANEL DIAG BUILD" so there is no doubt about which one is live.
[env:128x64-diag]
build_flags = -DPANEL_VARIANT_128X64 -DPANEL_DIAG
build_src_filter = +<*> -<weather_layout_64x64.cpp>

[env:64x64-diag]
build_flags = -DPANEL_VARIANT_64X64 -DPANEL_DIAG
build_src_filter = +<*> -<weather_layout_128x64.cpp>

; Wireless updates are MQTT-triggered HTTP pull, not espota - the firmware has no
; ArduinoOTA listener (removed in 0665892). See CLAUDE.md "Deploying without USB".
